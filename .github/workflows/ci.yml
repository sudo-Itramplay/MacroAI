name: Revisió de Codi Python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  qualitat-codi:
    runs-on: ubuntu-latest
    steps:
    - name: Obtenir el codi
      uses: actions/checkout@v4
      
    - name: Configurar entorn Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Instal·lar eines de revisió
      run: |
        python -m pip install --upgrade pip
        pip install ruff bandit
        
    - name: Comprovar estil (Ruff)
      run: ruff check .
      
    - name: Comprovar seguretat (Bandit)
      run: bandit -r . -ll -ii

    - name: Instal·lar dependències de test
      run: pip install pytest pytest-mock

    - name: Executar proves unitàries (Pytest)
      run: pytest tests/ -v
